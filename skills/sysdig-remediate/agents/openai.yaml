dependencies:
  # The Sysdig MCP server (secure-mcp-server) is intentionally not declared
  # here: it is a hosted, multi-region OAuth server with no static URL —
  # users register it themselves per references/mcp-setup.md.
  tools:
    - type: "mcp"
      value: "github"
      description: "GitHub MCP server — provides repository search, PR creation, and code browsing"
      transport: "streamable_http"
      url: "https://api.githubcopilot.com/mcp/"
      headers:
        Authorization: "Bearer ${GITHUB_PERSONAL_ACCESS_TOKEN}"
    - type: "mcp"
      value: "jira-mcp-server"
      description: "Jira/Atlassian MCP server — ticket search, creation, and updates. /sysdig-remediate is the sole ticket creator in the Sysdig vulnerability workflow (step 5b)."
      transport: "stdio"
      command: "npx"
      args: ["-y", "--package=mcp-atlassian", "--package=jsdom", "mcp-atlassian"]
      env:
        ATLASSIAN_API_TOKEN: "${JIRA_API_TOKEN}"
        ATLASSIAN_BASE_URL: "${JIRA_BASE_URL}"
        ATLASSIAN_EMAIL: "${JIRA_USER_EMAIL}"
