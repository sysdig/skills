dependencies:
  # The Sysdig MCP server (secure-mcp-server) is intentionally not declared
  # here: it is a hosted, multi-region OAuth server with no static URL —
  # users register it themselves per references/mcp-setup.md. This skill is
  # MCP-only; its Phase 0a preflight aborts if the server is unreachable.
  tools:
    - type: "mcp"
      value: "jira-mcp-server"
      description: "Jira/Atlassian MCP server — provides ticket search, creation, and updates. Optional — only used if the user opts in to ticket creation in the Phase 3 handoff."
      transport: "stdio"
      command: "npx"
      args: ["-y", "--package=mcp-atlassian", "--package=jsdom", "mcp-atlassian"]
      env:
        ATLASSIAN_API_TOKEN: "${JIRA_API_TOKEN}"
        ATLASSIAN_BASE_URL: "${JIRA_BASE_URL}"
        ATLASSIAN_EMAIL: "${JIRA_USER_EMAIL}"
